<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poll screen</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="poll.js"></script>
</head>
<body>
<div class="s-wrap">
  <div class="s-head">
    <div class="s-prompt" id="prompt"></div>
    <div class="s-join" id="join"><div class="url" id="url"></div><div id="qr"></div></div>
  </div>
  <div class="s-body" id="body"></div>
  <div class="s-foot"><span id="title"></span><span id="count"></span></div>
</div>
<script>
(function () {
  const P = window.Poller; if (!P) return;
  const esc = P.escapeHtml;
  const body = document.getElementById("body"), promptEl = document.getElementById("prompt"), countEl = document.getElementById("count");
  document.getElementById("url").textContent = P.shortUrl();
  P.drawQr(document.getElementById("qr"), P.participantUrl(), 170);
  P.base.child("meta/title").on("value", (s) => { document.getElementById("title").textContent = s.val() || ""; });

  let live = null, question = null, answers = {}, qSub = null, aSub = null;

  P.base.child("live").on("value", (s) => {
    const l = s.val() || { q: null, state: "closed", show: false };
    const changed = !live || live.q !== l.q;
    live = l;
    if (changed) subscribe(l.q); else render();
  });

  function subscribe(qid) {
    if (qSub) qSub.off(); if (aSub) aSub.off();
    question = null; answers = {};
    if (!qid) { render(); return; }
    qSub = P.base.child("questions/" + qid);
    qSub.on("value", (s) => { question = s.val(); render(); });
    aSub = P.base.child("answers/" + qid);
    aSub.on("value", (s) => { answers = s.val() || {}; render(); });
  }

  function render() {
    const n = Object.keys(answers).length;
    if (!live || !live.q) {
      promptEl.textContent = "";
      countEl.textContent = "";
      document.getElementById("join").classList.add("hidden");
      body.innerHTML = '<div class="joinpage"><div class="sub">Open this link on your phone</div><div class="url">' + esc(P.shortUrl()) + '</div><div id="bigqr"></div></div>';
      // as big as the screen allows: most of the height below the link
      P.drawQr(document.getElementById("bigqr"), P.participantUrl(), Math.max(280, Math.min(window.innerHeight - 320, window.innerWidth * 0.5)));
      return;
    }
    document.getElementById("join").classList.remove("hidden");
    if (!question) { promptEl.textContent = ""; body.innerHTML = ""; return; }
    promptEl.textContent = question.prompt;
    countEl.textContent = n + (n === 1 ? " answer" : " answers") + (live.state === "open" ? "" : " · closed");
    if (!live.show) {
      body.innerHTML = '<div class="s-count"><div class="n">' + n + '</div>' + (n === 1 ? "answer" : "answers") + (live.state === "open" ? " so far" : "") + "</div>";
      return;
    }
    const vals = Object.values(answers);
    if (question.type === "choice") renderBars(vals, n);
    else if (question.type === "number") renderDots(vals, n);
    else renderCards(vals);
  }

  function renderBars(vals, n) {
    const opts = question.options || [];
    const counts = opts.map(() => 0);
    vals.forEach((a) => { const i = +a.v; if (i >= 0 && i < counts.length) counts[i]++; });
    const max = Math.max(1, ...counts);
    body.innerHTML = '<div class="bars">' + opts.map((o, i) =>
      '<div class="bar"><div class="lab">' + esc(o) + '</div><div class="track"><div class="fill" style="width:' + (100 * counts[i] / max) + '%"></div></div>' +
      '<div class="n">' + counts[i] + (n ? " · " + Math.round(100 * counts[i] / n) + "%" : "") + "</div></div>").join("") + "</div>";
  }

  function renderDots(vals, n) {
    const min = +question.min || 0, max = question.max == null ? 100 : +question.max, step = +question.step || 1;
    const xs = vals.map((a) => +a.v).filter((v) => !isNaN(v));
    const nb = Math.round((max - min) / step) + 1;
    const bins = new Array(nb).fill(0);
    xs.forEach((v) => { let i = Math.round((Math.min(max, Math.max(min, v)) - min) / step); bins[i]++; });
    const W = 1300, padL = 40, padR = 40, axisY = 330, r = Math.max(5, Math.min(14, (W - padL - padR) / nb / 2 - 1));
    const tall = Math.max(1, ...bins);
    const rowH = Math.min(2 * r + 2, (axisY - 30) / tall);
    const x = (v) => padL + (v - min) / (max - min || 1) * (W - padL - padR);
    let svg = '<svg viewBox="0 0 ' + W + ' 380" xmlns="http://www.w3.org/2000/svg">';
    svg += '<line x1="' + padL + '" y1="' + axisY + '" x2="' + (W - padR) + '" y2="' + axisY + '" stroke="currentColor" stroke-width="2"/>';
    const ticks = niceTicks(min, max);
    ticks.forEach((t) => {
      svg += '<line x1="' + x(t) + '" y1="' + axisY + '" x2="' + x(t) + '" y2="' + (axisY + 8) + '" stroke="currentColor" stroke-width="2"/>';
      svg += '<text x="' + x(t) + '" y="' + (axisY + 34) + '" text-anchor="middle" font-size="22" fill="currentColor">' + t + esc(question.unit || "") + "</text>";
    });
    bins.forEach((c, i) => {
      for (let k = 0; k < c; k++) {
        svg += '<circle cx="' + x(min + i * step) + '" cy="' + (axisY - 6 - r - k * rowH) + '" r="' + r + '" fill="#4a6693" opacity="0.85"/>';
      }
    });
    if (xs.length) {
      const sorted = xs.slice().sort((a, b) => a - b);
      const med = sorted.length % 2 ? sorted[(sorted.length - 1) / 2] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
      svg += '<line x1="' + x(med) + '" y1="20" x2="' + x(med) + '" y2="' + axisY + '" stroke="#b45309" stroke-width="3" stroke-dasharray="8 6"/>';
      svg += '<text x="' + x(med) + '" y="16" text-anchor="middle" font-size="20" fill="#b45309">median ' + med + esc(question.unit || "") + "</text>";
    }
    svg += "</svg>";
    body.innerHTML = '<div class="dots">' + svg + '<div class="stat">' + n + " answers" + (xs.length ? " · from " + Math.min(...xs) + " to " + Math.max(...xs) + esc(question.unit || "") : "") + "</div></div>";
  }

  function niceTicks(min, max) {
    const span = max - min || 1;
    const raw = span / 8, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const stepT = [1, 2, 5, 10].map((m) => m * mag).find((s) => span / s <= 10) || mag * 10;
    const out = [];
    for (let t = Math.ceil(min / stepT) * stepT; t <= max + 1e-9; t += stepT) out.push(+t.toFixed(6));
    return out;
  }

  function renderCards(vals) {
    const sorted = vals.slice().sort((a, b) => (a.t || 0) - (b.t || 0));
    body.innerHTML = '<div class="cards">' + sorted.map((a) =>
      '<div class="card">' + (a.label ? '<div class="lab">' + esc(a.label) + "</div>" : "") + esc(a.v) + "</div>").join("") + "</div>";
  }
})();
</script>
</body>
</html>
